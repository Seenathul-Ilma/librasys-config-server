server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Seenathul-Ilma/librasys-config-server
          search-paths:
            - src/main/resources/configurations
            - src/main/resources/configurations/services
            - src/main/resources/configurations/platforms
        native:
          search-locations:
            - classpath:/configurations
            - classpath:/configurations/platforms
            - classpath:/configurations/services

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
